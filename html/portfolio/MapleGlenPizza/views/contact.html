<h1 class="h3 fw-bold mb-4">Contact Us</h1>

<div class="row g-4">

    <div class="col-md-5">
        <div class="card h-100">
            <div class="card-body">
                <div class="fw-bold mb-1">Phone</div>
                <div class="text-muted mb-3">
                    {{phone}}
                </div>

                <div class="fw-bold mb-1">Address</div>
                <div class="text-muted mb-3">
                    {{address}}
                </div>

                <a class="btn btn-outline-primary" ng-href="{{mapsUrl}}" target="_blank">
                    Get Directions
                </a>

            </div>
        </div>
    </div>

    <div class="col-md-7">
        <div class="card h-100">
            <div class="card-body">
                <div class="fw-bold mb-3">Business Hours</div>

                <div class="d-flex justify-content-between py-1 border-bottom" ng-repeat="h in hours track by $index">
                    <span>{{h.day}}</span>
                    <span class="text-muted">{{h.open}} - {{h.close}}</span>
                </div>
            </div>
        </div>
    </div>
</div>
