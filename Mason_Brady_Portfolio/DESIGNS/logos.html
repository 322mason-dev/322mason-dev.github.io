    <script>
        // CHANGE THIS if your images are stored in a different folder
        const imageFolder = "../IMAGES/logos/";

        const possibleExtensions = [".png", ".jpg", ".jpeg", ".webp"];

        function loadImageWithFallback(imgElement, baseFileName) {
            let index = 0;

            function tryNextExtension() {
                if (index >= possibleExtensions.length) {
                    console.warn("Could not load image:", baseFileName);
                    imgElement.alt = baseFileName + " not found";
                    return;
                }

                const testSrc = imageFolder + baseFileName + possibleExtensions[index];
                const testImage = new Image();

                testImage.onload = function () {
                    imgElement.src = testSrc;
                };

                testImage.onerror = function () {
                    index++;
                    tryNextExtension();
                };

                testImage.src = testSrc;
            }

            tryNextExtension();
        }

        document.addEventListener("DOMContentLoaded", function () {
            const images = document.querySelectorAll(".portfolio-image");

            images.forEach(function (img) {
                const fileName = img.dataset.file;
                loadImageWithFallback(img, fileName);
            });
        });
    </script>
