    function loadImageWithFallback(imgElement, baseFileName) {
        let index = 0;

        function tryNextExtension() {
            if (index >= possibleExtensions.length) {
                console.warn("Could not load image:", baseFileName);
                imgElement.alt = baseFileName + " not found";
                return;
            }

            const testSrc = imageFolder + baseFileName + possibleExtensions[index];
            const testImage = new Image();

            testImage.onload = function () {
                imgElement.src = testSrc;
            };

            testImage.onerror = function () {
                index++;
                tryNextExtension();
            };

            testImage.src = testSrc;
        }

        tryNextExtension();
    }

    function createProjectCards() {
        const grid = document.getElementById("projectGrid");

        projects.forEach(function(project, index) {
            const card = document.createElement("div");
            card.className = "project-card";
            card.onclick = function() {
                openProjectModal(index);
            };

            card.innerHTML = `
                <div class="project-card-image">
                    <img class="portfolio-image" alt="${project.title}">
                </div>

                <div class="project-card-text">
                    <p class="project-category">${project.category}</p>
                    <h3>${project.title}</h3>
                    <p>${project.description}</p>
                    <span>${project.programs}</span>
                </div>
            `;

            grid.appendChild(card);

            const img = card.querySelector(".portfolio-image");
            loadImageWithFallback(img, project.file);
        });
    }

    function openProjectModal(index) {
        const project = projects[index];

        document.getElementById("modalTitle").textContent = project.title;
        document.getElementById("modalCategory").textContent = project.category;
        document.getElementById("modalDescription").textContent = project.description;
        document.getElementById("modalPrograms").textContent = project.programs;

        const modalImage = document.getElementById("modalImage");
        modalImage.alt = project.title;
        loadImageWithFallback(modalImage, project.file);

        document.getElementById("projectModal").classList.add("active");
        document.body.classList.add("modal-open");
    }

    function closeProjectModal() {
        document.getElementById("projectModal").classList.remove("active");
        document.body.classList.remove("modal-open");
    }

    document.getElementById("projectModal").addEventListener("click", function(event) {
        if (event.target === this) {
            closeProjectModal();
        }
    });

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            closeProjectModal();
        }
    });

    document.addEventListener("DOMContentLoaded", createProjectCards);
</script>
